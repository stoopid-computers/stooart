name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  native:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/')
    needs: check
    name: native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04
            target: linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: pnpm test:native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist/stooart-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  candidate:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - run: chmod +x dist/stooart-darwin-arm64 dist/stooart-linux-x64
      - run: pnpm release:pack
      - name: Verify exact candidate
        env:
          STOOART_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          pnpm release:verify .stooart-release/release-metadata.json .stooart-release/SHA256SUMS
          root_archive="$(jq -r '.tarballs[0].file' .stooart-release/release-metadata.json)"
          if test "$(uname -s)" = Darwin; then target=darwin-arm64; else target=linux-x64; fi
          platform_archive="$(jq -r --arg target "compootor-stooart-$target" '.tarballs[] | select(.file | startswith($target)) | .file' .stooart-release/release-metadata.json)"
          test -n "$platform_archive"
          pnpm exec node --experimental-strip-types scripts/verify-package.ts ".stooart-release/$root_archive" ".stooart-release/$platform_archive"
          deno publish --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: .stooart-release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
