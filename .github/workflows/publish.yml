name: Publish
run-name: Publish stooart ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json, for example 0.1.0
        type: string
        required: true

permissions:
  contents: read

# Keep all versions in one queue so registry publication cannot race.
concurrency:
  group: stooart-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Check release branch and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="$(bun -p 'require("./package.json").version')"
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = release/0.1
          test "$RELEASE_VERSION" = "$version"
          test "$version" = 0.1.0
      - name: Select the original tested release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun -p 'require("./package.json").version')"
          branch="release/${version%.*}"
          source_sha="$GITHUB_SHA"
          git merge-base --is-ancestor "$source_sha" "refs/remotes/origin/$branch"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$source_sha" -f branch="$branch" -f status=completed -f per_page=100 \
            > "$RUNNER_TEMP/candidate-runs.json"
          run_id="$(jq -er --arg sha "$source_sha" --arg branch "$branch" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.id) | first | .id' "$RUNNER_TEMP/candidate-runs.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            > "$RUNNER_TEMP/candidate-artifacts.json"
          artifact_id="$(jq -er --arg name "release-$source_sha" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else error("expected one unexpired original candidate artifact") end' "$RUNNER_TEMP/candidate-artifacts.json")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .stooart-release
      - run: bun install --frozen-lockfile --production --ignore-scripts
      - name: Verify candidate provenance and contents
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          STOOART_EXPECTED_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          STOOART_EXPECTED_VERSION="$RELEASE_VERSION" bun run release:verify .stooart-release/release-metadata.json .stooart-release/SHA256SUMS
          archive="$(jq -er '.tarball.file' .stooart-release/release-metadata.json)"
          bun run scripts/verify-package.ts ".stooart-release/$archive"
          deno publish --dry-run

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Recheck release branch and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="$(bun -p 'require("./package.json").version')"
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = release/0.1
          test "$RELEASE_VERSION" = "$version"
          test "$version" = 0.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          run-id: ${{ needs.verify.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .stooart-release
      - run: bun install --frozen-lockfile --production --ignore-scripts
      - name: Reverify the exact candidate before publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          STOOART_EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          STOOART_EXPECTED_VERSION="$RELEASE_VERSION" bun run release:verify .stooart-release/release-metadata.json .stooart-release/SHA256SUMS
          archive="$(jq -er '.tarball.file' .stooart-release/release-metadata.json)"
          bun run scripts/verify-package.ts ".stooart-release/$archive"
      - name: Check npm version integrity
        id: npm-status
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          archive="$(jq -er '.tarball.file' .stooart-release/release-metadata.json)"
          expected="sha512-$(openssl dgst -sha512 -binary ".stooart-release/$archive" | openssl base64 -A)"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' "https://registry.npmjs.org/@compootor%2fstooart/$RELEASE_VERSION")"
          test "$status" = 200 || test "$status" = 404
          if test "$status" = 200; then
            actual="$(jq -er '.dist.integrity' "$RUNNER_TEMP/npm-version.json")"
            test "$actual" = "$expected"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish tested npm archive
        if: steps.npm-status.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          archive="$(jq -er '.tarball.file' .stooart-release/release-metadata.json)"
          if test -n "${NPM_TOKEN:-}"; then
            printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$RUNNER_TEMP/stooart.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/stooart.npmrc"
          fi
          bunx --bun npm@12.1.0 publish ".stooart-release/$archive" --provenance --access public
      - name: Check existing JSR version
        id: jsr-status
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/jsr-meta.json" --write-out '%{http_code}' "https://jsr.io/@compootor/stooart/meta.json")"
          test "$status" = 200 || test "$status" = 404
          if test "$status" = 200 && jq -e --arg version "$RELEASE_VERSION" '.versions[$version] != null' "$RUNNER_TEMP/jsr-meta.json" > /dev/null; then
            test "$(jq -r --arg version "$RELEASE_VERSION" '.versions[$version].yanked // false' "$RUNNER_TEMP/jsr-meta.json")" != true
            curl --fail --silent --show-error "https://jsr.io/@compootor/stooart/${RELEASE_VERSION}_meta.json" -o "$RUNNER_TEMP/jsr-version-meta.json"
            jq -r '.publish.include[]' jsr.json | while IFS= read -r file; do
              expected="sha256-$(shasum -a 256 "$file" | awk '{print $1}')"
              actual="$(jq -r --arg file "/$file" '.manifest[$file].checksum // empty' "$RUNNER_TEMP/jsr-version-meta.json")"
              test "$actual" = "$expected"
            done
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish JSR sources with OIDC
        if: steps.jsr-status.outputs.publish == 'true'
        run: deno publish
      - name: Verify registry contents
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          archive="$(jq -er '.tarball.file' .stooart-release/release-metadata.json)"
          expected="sha512-$(openssl dgst -sha512 -binary ".stooart-release/$archive" | openssl base64 -A)"
          actual="$(curl --fail --silent --show-error "https://registry.npmjs.org/@compootor%2fstooart/$RELEASE_VERSION" | jq -er '.dist.integrity')"
          test "$actual" = "$expected"
          curl --fail --silent --show-error "https://jsr.io/@compootor/stooart/meta.json" | jq -e --arg version "$RELEASE_VERSION" '.versions[$version] != null and (.versions[$version].yanked | not)' > /dev/null
          curl --fail --silent --show-error "https://jsr.io/@compootor/stooart/${RELEASE_VERSION}_meta.json" -o "$RUNNER_TEMP/jsr-version-meta.json"
          jq -r '.publish.include[]' jsr.json | while IFS= read -r file; do
            expected="sha256-$(shasum -a 256 "$file" | awk '{print $1}')"
            actual="$(jq -r --arg file "/$file" '.manifest[$file].checksum // empty' "$RUNNER_TEMP/jsr-version-meta.json")"
            test "$actual" = "$expected"
          done
      - name: Create or complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          STOOART_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$STOOART_SOURCE_SHA"
          fi
          if ! gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/github-release.json"; then
            gh release create "$tag" --draft --target "$STOOART_SOURCE_SHA" --generate-notes
            gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/github-release.json"
          fi
          for file in .stooart-release/*; do
            name="$(basename "$file")"
            if jq -e --arg name "$name" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/github-release.json" > /dev/null; then
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/published-release"
            else
              gh release upload "$tag" "$file"
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/published-release"
            fi
            cmp "$file" "$RUNNER_TEMP/published-release/$name"
          done
          if test "$(jq -r '.isDraft' "$RUNNER_TEMP/github-release.json")" = true; then
            gh release edit "$tag" --draft=false
          fi
