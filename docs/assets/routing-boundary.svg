<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" role="img" aria-labelledby="title desc">
  <title id="title">stooart routing boundary</title>
  <desc id="desc">A task request passes policy checks, then uses one explicit strategy to recommend a worker. The recommendation never runs a command.</desc>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 17px; }
    .box { fill: #f6f8fb; stroke: #52627a; stroke-width: 2; }
    .accent { fill: #e7f5ef; stroke: #1f7a56; stroke-width: 2; }
    .muted { fill: #fff6df; stroke: #a26d00; stroke-width: 2; }
    .arrow { stroke: #52627a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker></defs>
  <rect width="520" height="720" rx="18" fill="#fff"/>
  <rect class="box" x="60" y="28" width="400" height="105" rx="14"/>
  <text class="label" x="260" y="66" text-anchor="middle">1. Request</text><text class="small" x="260" y="96" text-anchor="middle">task, workers, scope, tools, health</text>
  <path class="arrow" d="M260 133 V174"/>
  <rect class="accent" x="60" y="174" width="400" height="130" rx="14"/>
  <text class="label" x="260" y="213" text-anchor="middle">2. Policy checks</text><text class="small" x="260" y="243" text-anchor="middle">remove ineligible workers</text><text class="small" x="260" y="268" text-anchor="middle">keep unresolved work local</text>
  <path class="arrow" d="M260 304 V345"/>
  <rect class="box" x="42" y="345" width="436" height="160" rx="14"/>
  <text class="label" x="260" y="383" text-anchor="middle">3. Choose one strategy</text><text class="small" x="260" y="416" text-anchor="middle">Priority: deterministic default</text><text class="small" x="260" y="443" text-anchor="middle">Jev: optional network choice</text><text class="small" x="260" y="470" text-anchor="middle">Recipes: opt-in evidence reuse</text>
  <path class="arrow" d="M260 505 V546"/>
  <rect class="muted" x="60" y="546" width="400" height="112" rx="14"/>
  <text class="label" x="260" y="585" text-anchor="middle">4. Recommendation</text><text class="small" x="260" y="616" text-anchor="middle">worker + reasons, no execution</text>
  <text class="small" x="260" y="696" text-anchor="middle">Only explicit verify runs a check.</text>
</svg>
